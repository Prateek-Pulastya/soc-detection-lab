<!--
  Add this block to the Windows agent's ossec.conf, inside <ossec_config>:
    C:\Program Files (x86)\ossec-agent\ossec.conf
  Then restart the agent:  Restart-Service -Name WazuhSvc
  It forwards the Sysmon operational channel to the manager so EID 1/3/8/10/11/13 land in Wazuh.
-->
<localfile>
  <location>Microsoft-Windows-Sysmon/Operational</location>
  <log_format>eventchannel</log_format>
</localfile>

<!-- Also useful for several techniques (account creation 4720, log clear 1102, RDP 4624): -->
<localfile>
  <location>Security</location>
  <log_format>eventchannel</log_format>
</localfile>
