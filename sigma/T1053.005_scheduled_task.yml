title: Scheduled Task Creation for Persistence
id: c3d4e5f6-3a4b-4c5d-8e02-1a2b3c4d5e60   # regenerate your own UUID if you fork widely
status: experimental
description: >
  Detects creation of a scheduled task via schtasks.exe /create or the PowerShell
  Register-ScheduledTask / New-ScheduledTask cmdlets. Keys on the task-creation
  behaviour, not on the atomic's task name.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: DetectForge
date: 2026/08/14
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_schtasks:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  selection_ps:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'Register-ScheduledTask'
      - 'New-ScheduledTask'
  condition: selection_schtasks or selection_ps
falsepositives:
  - Software installers and admins legitimately create scheduled tasks. Tune with an
    allowlist of parent Images / known task names (see filter_benign stub).
level: medium
