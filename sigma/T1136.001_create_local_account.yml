title: Local Account Creation
id: 07182a3b-7a8b-4c5d-8e06-5a6b7c8d9ea4   # regenerate your own UUID if you fork widely
status: experimental
description: >
  Detects creation of a local user account via net.exe user /add or the PowerShell
  New-LocalUser cmdlet. The Security-channel EventID 4720 (a user account was created)
  is caught by a companion native Wazuh rule (see local_rules.xml 100262).
references:
  - https://attack.mitre.org/techniques/T1136/001/
author: DetectForge
date: 2026/08/14
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_net:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains|all:
      - 'user'
      - '/add'
  selection_ps:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains: 'New-LocalUser'
  condition: selection_net or selection_ps
falsepositives:
  - Legitimate IT provisioning creates local accounts. Correlate with the actor/host and
    allowlist known provisioning automation if it is noisy.
level: medium
